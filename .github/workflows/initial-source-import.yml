name: One-time source import runner check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/initial-source-import.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner availability without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          printf 'M-Money source import runner is available.\n'
          git --version
          python3 --version
